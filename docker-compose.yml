services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estudaja
      POSTGRES_PASSWORD: estudaja
      POSTGRES_DB: estudaja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudaja -d estudaja"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://estudaja:estudaja@postgres:5432/estudaja?sslmode=disable
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRATION: 24h
      ADMIN_EMAIL: admin@estudaja.com
      ADMIN_PASSWORD: admin123
      DEMO_PROFESSOR_EMAIL: professor@estudaja.com
      DEMO_PROFESSOR_PASSWORD: professor123
      DEMO_ALUNO_EMAIL: aluno@estudaja.com
      DEMO_ALUNO_PASSWORD: aluno123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
